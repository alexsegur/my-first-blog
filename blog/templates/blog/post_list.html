{% extends 'blog/base.html' %}
{% block content %}

    <div>
        {% for post in posts %}
            <div>
                <h3><a href="{% url 'post_detail' pk=post.pk %}">{{ post.title }}</a></h3>
                <p>Publicado: {{ post.published_date }}</p>
                <p>{{ post.text|linebreaksbr }}</p>
            </div>
        {% endfor %}
    </div>
{% endblock %}
